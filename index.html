<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Unverbindliches Website-Konzept für Rolff Bedachungen – gestaltet von KA Technologies." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preload" href="/assets/hero-roofer.jpg" as="image" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      body.demo-locked{overflow:hidden}body.demo-locked>#app{visibility:hidden}.demo-login{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#041a32,#0755a3);font-family:Arial,sans-serif}.demo-login[hidden]{display:none}.demo-login-card{width:min(100%,420px);padding:40px;background:#fff;border-radius:16px;box-shadow:0 28px 80px #02101f66;color:#101b2d}.demo-login-card small{color:#0755a3;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.demo-login-card h1{margin:16px 0 10px;font-size:32px;letter-spacing:-.04em}.demo-login-card p{margin:0 0 28px;color:#617080;font-size:14px;line-height:1.6}.demo-login-card label{display:block;margin-bottom:9px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.demo-login-card input{width:100%;height:54px;padding:0 15px;border:1px solid #ccd8e4;border-radius:8px;font-size:16px;outline:0}.demo-login-card input:focus{border-color:#0755a3;box-shadow:0 0 0 4px #0755a31a}.demo-login-card button{width:100%;height:54px;margin-top:14px;border:0;border-radius:8px;background:#0755a3;color:#fff;font-weight:700;cursor:pointer}.demo-login-error{min-height:18px;margin:10px 0 0;color:#b20b1b;font-size:12px}
    </style>
    <title>Website-Demo für Rolff Bedachungen | KA Technologies</title>
    <script type="module" crossorigin src="/assets/index-BVOEuifU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C0sMZGF0.css">
  </head>
  <body class="demo-locked">
    <div class="demo-login" id="demo-login">
      <form class="demo-login-card" id="demo-login-form">
        <small>Private Kundendemo</small><h1>Rolff Bedachungen</h1>
        <p>Diese Website ist ein geschütztes Konzept von KA Technologies.</p>
        <label for="demo-password">Passwort</label>
        <input id="demo-password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Demo öffnen</button><div class="demo-login-error" id="demo-login-error" role="alert"></div>
      </form>
    </div>
    <div id="app"></div>
    <script>
      (() => {
        const gate = document.getElementById('demo-login');
        const unlock = () => { document.body.classList.remove('demo-locked'); gate.hidden = true };
        if (sessionStorage.getItem('rolff-demo-access') === 'granted' || document.cookie.includes('rolff_demo_client=1')) unlock();
        document.getElementById('demo-login-form').addEventListener('submit', event => {
          event.preventDefault();
          if (document.getElementById('demo-password').value === 'Rolff2026') {
            sessionStorage.setItem('rolff-demo-access', 'granted'); unlock();
          } else {
            document.getElementById('demo-login-error').textContent = 'Das Passwort ist nicht korrekt.';
            document.getElementById('demo-password').select();
          }
        });
      })();
    </script>
  </body>
</html>
